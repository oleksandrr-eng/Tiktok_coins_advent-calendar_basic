<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>New Year Advent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cyan:#25f4ee; --red:#fe2c55; --ink:#161823; --muted:rgba(22,24,35,.5); --soft:#f1f1f2; --line:rgba(22,24,35,.08);
  --k:1; --cs:80px;
  --gl:14px; --gr:14px; --gt:12px; --gb:14px; --gbt:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff}
@supports (padding:max(0px)){:root{
  --gl:max(14px,env(safe-area-inset-left,0px)); --gr:max(14px,env(safe-area-inset-right,0px));
  --gt:max(12px,env(safe-area-inset-top,0px)); --gb:max(14px,env(safe-area-inset-bottom,0px)); --gbt:max(6px,env(safe-area-inset-bottom,0px))}}
@supports (-webkit-touch-callout:none){html,body{height:-webkit-fill-available}}
@supports (height:100dvh){html,body{height:100dvh}}
body{font-family:var(--font);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
svg{display:block}

.app{height:100%;display:flex;align-items:center;justify-content:center;background:#fff}
.game{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:#fff}
@media (min-aspect-ratio:10/16) and (min-height:501px) and (hover:hover) and (pointer:fine){
  .app{padding:12px;background:#f4f4f5}
  .game{width:auto;height:100%;max-height:940px;aspect-ratio:9/19.5;max-width:100%;border-radius:30px;box-shadow:0 30px 70px rgba(22,24,35,.14),0 0 0 1px rgba(22,24,35,.06)}
  @supports not (aspect-ratio:1/1){.game{width:calc((100vh - 24px) * .4615);max-width:434px}}
}
@media (min-aspect-ratio:10/16) and (min-height:800px) and (hover:hover) and (pointer:fine){.app{padding:24px}}
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  .rotate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;color:var(--ink);font-weight:800;font-size:18px;text-align:center;padding:20px}
  .rotate i{font-style:normal;font-size:46px;animation:turn 1.6s ease-in-out infinite}
}

.main{position:relative;z-index:2;height:100%;width:100%;max-width:calc(560px*var(--k));margin:0 auto;display:flex;flex-direction:column}

/* app bar */
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--gt) + 2px*var(--k)) var(--gr) calc(8px*var(--k)) var(--gl)}
.icon{flex:none;position:relative;width:calc(40px*var(--k));height:calc(40px*var(--k));border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.icon svg{width:calc(20px*var(--k));height:calc(20px*var(--k));fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon .badge{position:absolute;top:-4px;right:-4px;min-width:calc(19px*var(--k));height:calc(19px*var(--k));padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:calc(11px*var(--k));font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.icon.bump{animation:bumpI .4s}
.ny{position:relative;flex:1;min-width:0;height:calc(40px*var(--k));display:flex;align-items:center;justify-content:center;gap:calc(6px*var(--k));border-radius:99px;background:var(--ink);color:#fff}
.ny b{font-size:calc(14px*var(--k));font-weight:800;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
.ny b em{font-style:normal;color:var(--red)}
.ny span{font-size:calc(15px*var(--k))}

.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(12px*var(--k));padding:0 var(--gr) calc(10px*var(--k)) var(--gl)}
.event{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 calc(2px*var(--k))}
.event small{display:block;font-size:calc(11px*var(--k));font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.event>div:first-child{min-width:0}
.ttl{flex:none;margin:0 0 calc(-4px*var(--k));font-size:calc(30px*var(--k));font-weight:900;line-height:1.1;white-space:nowrap;text-align:center;letter-spacing:-.01em}
.event{flex-direction:column;align-items:center;justify-content:center;gap:calc(6px*var(--k));text-align:center}
.event h1{margin:4px 0 0;font-size:calc(22px*var(--k));font-weight:900;line-height:1.08}
.event p{margin:0;font-size:calc(12.5px*var(--k));font-weight:600;color:var(--muted);line-height:1.3}
.pill{flex:none;display:flex;align-items:center;gap:calc(6px*var(--k));height:calc(40px*var(--k));padding:0 calc(14px*var(--k)) 0 calc(5px*var(--k));border-radius:99px;background:var(--soft);
  font-size:calc(17px*var(--k));font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:-1px 0 0 var(--cyan),1px 0 0 var(--red)}
.pill .coin{width:calc(30px*var(--k));height:calc(30px*var(--k))}
.pill.bump{animation:bump .3s}
.coin{display:inline-block;flex:none;width:30px;height:30px}
.coin img,.gpic img{display:block;width:100%;height:100%;object-fit:contain}

/* calendar grid */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:calc(8px*var(--k))}
.box{position:relative;min-width:0;min-height:0;border-radius:calc(14px*var(--k));display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft);transition:background .2s}
.box:active{transform:scale(.96)}
.box .q{font-size:calc(var(--cs)*.36);font-weight:900;line-height:1;color:var(--ink)}
.box .q:before{content:attr(data-n)}
.box .day{margin-top:calc(var(--cs)*.04);font-size:calc(var(--cs)*.11);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.box .lk{display:none;position:absolute;top:calc(var(--cs)*.09);right:calc(var(--cs)*.09);width:calc(var(--cs)*.16);height:calc(var(--cs)*.16);color:var(--ink);opacity:.3}
.box .lk svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.box .tease{display:none;position:absolute;top:calc(var(--cs)*.05);left:calc(var(--cs)*.06);width:calc(var(--cs)*.22);height:calc(var(--cs)*.22)}
.box .tease img{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(0);opacity:.2}
.box.gift .tease{display:block}
.box.lock .lk{display:block}
.box.lock .q{color:rgba(22,24,35,.3)}
.box.lock .day{opacity:.5}
.box.next{background:#fff;box-shadow:inset 0 0 0 2px var(--red);animation:nextp 1.4s ease-in-out infinite}
.box.next .day{color:var(--red)}
.box.b24{background:var(--red)}
.box.b24 .q,.box.b24 .day{color:#fff}
.box.b24 .lk{color:#fff;opacity:.75}
.box.b24.next{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--red)}
.box.b24 .tease img{filter:brightness(0) invert(1);opacity:.4}
.box.wig{animation:wig .6s ease-in-out}
.box.nope{animation:nope .3s}
.box.shake{animation:shake .5s ease-in-out}
.box.open{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);animation:none}
.box.open .lk,.box.open .q,.box.open .tease{display:none}
.box.open .day{position:absolute;bottom:calc(var(--cs)*.07);margin:0;font-size:calc(var(--cs)*.095);color:rgba(22,24,35,.35);opacity:1}
.box .won{display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:-14%;width:100%}
.box.open .won{display:flex}
.won .coin{width:calc(var(--cs)*.32);height:calc(var(--cs)*.32)}
.won b{font-size:calc(var(--cs)*.17);font-weight:900;white-space:nowrap}
.won .gpic{width:calc(var(--cs)*.5);height:calc(var(--cs)*.5)}
.box.isgift{box-shadow:inset 0 0 0 1.5px var(--red)}

/* bottom */
.panel{flex:none}
.prow{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(13px*var(--k));font-weight:800;color:var(--muted)}
.prow span{color:var(--ink)}
.prow em{font-style:normal;color:var(--red)}
.bar{height:calc(4px*var(--k));margin:calc(8px*var(--k)) 0 calc(12px*var(--k));border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .5s}
.btn{width:100%;height:calc(52px*var(--k));border-radius:calc(8px*var(--k));font-size:calc(16px*var(--k));font-weight:800;display:flex;align-items:center;justify-content:center;gap:calc(8px*var(--k))}
.btn svg{width:calc(18px*var(--k));height:calc(18px*var(--k));fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.y{background:var(--red);color:#fff}
.btn.w{background:var(--soft);color:var(--ink)}
.btn:active{transform:scale(.98)}

/* tab bar */
.tabs{flex:none;display:flex;align-items:center;justify-content:space-around;padding:calc(6px*var(--k)) var(--gr) var(--gbt) var(--gl);border-top:1px solid var(--line);background:#fff}
.tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(2px*var(--k));font-size:calc(10px*var(--k));font-weight:700;color:var(--muted)}
.tab svg{width:calc(24px*var(--k));height:calc(24px*var(--k));fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{fill:currentColor}
.tab .dot{position:absolute;top:calc(-2px*var(--k));left:calc(50% + 7px*var(--k));min-width:calc(16px*var(--k));height:calc(16px*var(--k));padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-style:normal;font-size:calc(9px*var(--k));font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.tab.plus{justify-content:center;align-self:stretch}
.mk{position:relative;display:block;width:calc(46px*var(--k));height:calc(30px*var(--k))}
.mk:before,.mk:after{content:"";position:absolute;top:0;bottom:0;width:calc(40px*var(--k));border-radius:calc(9px*var(--k))}
.mk:before{left:0;background:var(--cyan)}
.mk:after{right:0;background:var(--red)}
.mk i{position:absolute;z-index:1;top:0;bottom:0;left:calc(3px*var(--k));right:calc(3px*var(--k));display:grid;place-items:center;border-radius:calc(8px*var(--k));background:var(--ink)}
.mk i svg{width:calc(18px*var(--k));height:calc(18px*var(--k));stroke:#fff;stroke-width:2.6;fill:none}

.toast{position:absolute;z-index:50;left:50%;bottom:calc(150px*var(--k));transform:translateX(-50%);max-width:88%;padding:calc(10px*var(--k)) calc(16px*var(--k));border-radius:99px;background:var(--ink);color:#fff;font-size:calc(13px*var(--k));font-weight:700;white-space:nowrap;pointer-events:none}
.toast.show{animation:toast 1.8s forwards}

/* reveal */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:var(--gt) var(--gr) var(--gb) var(--gl);
  background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pane{position:relative;width:min(calc(320px*var(--k)),100%);padding:calc(22px*var(--k)) calc(20px*var(--k)) calc(20px*var(--k));border-radius:calc(24px*var(--k));text-align:center;
  background:#fff;box-shadow:0 20px 60px rgba(22,24,35,.16),0 0 0 1px var(--line);}
.tag{display:inline-block;font-size:calc(12px*var(--k));font-weight:800;letter-spacing:.16em;color:var(--muted)}
.pane h2{margin:calc(4px*var(--k)) 0 0;font-size:calc(22px*var(--k));font-weight:900;line-height:1.1}
.prize{position:relative;width:calc(130px*var(--k));height:calc(130px*var(--k));margin:calc(14px*var(--k)) auto 0;display:grid;place-items:center}
.prize .pic{position:relative;width:80%;height:80%;}
.prize.gift .pic{width:100%;height:100%;border-radius:calc(24px*var(--k));padding:12%;background:var(--soft)}
.prize .pic img{display:block;width:100%;height:100%;object-fit:contain}
.big{margin-top:calc(10px*var(--k));font-size:calc(40px*var(--k));font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.big.name{font-size:calc(24px*var(--k));text-shadow:none}
.worth{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:calc(30px*var(--k));font-weight:900;font-variant-numeric:tabular-nums;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.worth .coin{width:calc(32px*var(--k));height:calc(32px*var(--k))}
.pane p{margin:6px 0 calc(18px*var(--k));font-size:calc(14px*var(--k));font-weight:600;color:var(--muted)}

/* full screens */
.screen{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(14px*var(--k));text-align:center;
  padding:calc(var(--gt) + 20px) var(--gr) var(--gb) var(--gl);background:#fff;animation:fade .25s;overflow-y:auto;touch-action:pan-y}
.screen h1{margin:0;font-size:calc(38px*var(--k));font-weight:900;line-height:1.05}
.screen h2{margin:0;font-size:calc(26px*var(--k));font-weight:900;line-height:1.15}
.screen p{margin:0;font-size:calc(15px*var(--k));font-weight:600;color:var(--muted);max-width:calc(320px*var(--k))}
.screen p b{color:var(--ink)}
.actions{display:grid;grid-template-columns:minmax(0,1fr);gap:calc(10px*var(--k));width:min(calc(330px*var(--k)),100%)}

/* transfer-to-account screen */
.send{justify-content:flex-start;align-items:stretch;text-align:left;padding-top:calc(var(--gt) + 2px*var(--k));gap:calc(14px*var(--k))}
.send>*{flex:none;width:100%;max-width:calc(520px*var(--k));margin-left:auto;margin-right:auto}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:calc(2px*var(--k))}
.sbar b{font-size:calc(17px*var(--k));font-weight:800}
.sbar .sp{flex:none;width:calc(40px*var(--k))}
.bal{display:flex;align-items:center;gap:calc(12px*var(--k));padding:calc(16px*var(--k));border-radius:calc(18px*var(--k));background:var(--soft)}
.bal .coin{width:calc(50px*var(--k));height:calc(50px*var(--k))}
.bal b{display:block;font-size:calc(34px*var(--k));font-weight:900;line-height:1;font-variant-numeric:tabular-nums;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.bal small{display:block;margin-top:4px;font-size:calc(13px*var(--k));font-weight:600;color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:calc(-6px*var(--k));font-size:calc(15px*var(--k));font-weight:900}
.sec em{font-style:normal;color:var(--muted);font-size:.85em;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:calc(8px*var(--k))}
.chip{display:flex;align-items:center;gap:calc(8px*var(--k));padding:calc(5px*var(--k)) calc(14px*var(--k)) calc(5px*var(--k)) calc(5px*var(--k));border-radius:99px;background:var(--soft);font-size:calc(13px*var(--k));font-weight:800;line-height:1.2}
.chip .gpic{width:calc(34px*var(--k));height:calc(34px*var(--k));padding:calc(3px*var(--k));border-radius:50%;background:#fff}
.chip small{display:flex;align-items:center;gap:3px;font-size:calc(11px*var(--k));font-weight:800;color:var(--muted)}
.chip small .coin{width:calc(13px*var(--k));height:calc(13px*var(--k))}
.nogift{font-size:calc(13px*var(--k));font-weight:600;color:var(--muted)}
.search{display:flex;align-items:center;gap:calc(8px*var(--k));width:100%;height:calc(52px*var(--k));padding:0 calc(14px*var(--k));border-radius:calc(10px*var(--k));background:var(--soft)}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.search.bad{animation:nope .3s;box-shadow:inset 0 0 0 1.5px var(--red)}
.search svg{flex:none;width:calc(20px*var(--k));height:calc(20px*var(--k));fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.search span{flex:none;font-size:calc(18px*var(--k));font-weight:800;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font-family:inherit;font-size:calc(17px*var(--k));font-weight:700;padding:0;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.search input::placeholder{color:rgba(22,24,35,.3)}
.search input.fill{animation:fillin .35s ease-out}
.paste{flex:none;height:calc(32px*var(--k));padding:0 calc(14px*var(--k));margin-right:-6px;border-radius:calc(6px*var(--k));background:var(--ink);color:#fff;font-size:calc(13px*var(--k));font-weight:800}
.paste:active{transform:scale(.95)}
.acct{display:flex;align-items:center;gap:calc(12px*var(--k));padding:calc(10px*var(--k)) calc(14px*var(--k)) calc(10px*var(--k)) calc(10px*var(--k));border-radius:calc(14px*var(--k));background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);animation:fillin .3s ease-out}
.av{flex:none;position:relative;width:calc(44px*var(--k));height:calc(44px*var(--k));border-radius:50%;display:grid;place-items:center;font-size:calc(19px*var(--k));font-weight:900;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--red))}
.av img,.pav img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.pav{display:block;width:calc(26px*var(--k));height:calc(26px*var(--k));border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--ink)}
.acct b{display:block;font-size:calc(15px*var(--k));font-weight:800;word-break:break-all}
.acct small{font-size:calc(12px*var(--k));font-weight:600;color:var(--muted)}
.acct .ok{flex:none;margin-left:auto;width:calc(22px*var(--k));height:calc(22px*var(--k));border-radius:50%;background:var(--cyan);display:grid;place-items:center}
.acct .ok svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.hint2{min-height:calc(16px*var(--k));margin:calc(-6px*var(--k)) 0 0!important;font-size:calc(13px*var(--k))!important;color:#e0173f!important;max-width:none!important}

/* sending: TikTok-LIVE style gift stream */
.sending{overflow:hidden}
/* sending */
.who{display:flex;align-items:center;justify-content:center;gap:calc(14px*var(--k));font-size:calc(18px*var(--k));font-weight:800}
.av.big{width:calc(50px*var(--k));height:calc(50px*var(--k));font-size:calc(21px*var(--k))}
.av.big:after{content:"";position:absolute;top:-5px;right:-5px;bottom:-5px;left:-5px;border-radius:50%;border:calc(3px*var(--k)) solid transparent;border-top-color:var(--red);border-right-color:var(--cyan);animation:spin .9s linear infinite}
.load{width:min(calc(260px*var(--k)),100%);height:calc(4px*var(--k));border-radius:99px;background:var(--soft);overflow:hidden}
.load i{display:block;height:100%;width:0;background:var(--ink);animation:loadbar 3s linear forwards}
/* done / prank */
.amount{display:flex;align-items:center;gap:calc(10px*var(--k));font-size:calc(42px*var(--k));font-weight:900;font-variant-numeric:tabular-nums;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.amount .coin{width:calc(46px*var(--k));height:calc(46px*var(--k))}
.sent{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(10px*var(--k));max-width:calc(330px*var(--k))}
.sg{position:relative;width:calc(54px*var(--k));height:calc(54px*var(--k));padding:calc(6px*var(--k));border-radius:calc(14px*var(--k));background:var(--soft)}
.sg .gpic{display:block;width:100%;height:100%}
.sg b{position:absolute;right:-5px;bottom:-5px;padding:1px 6px;border-radius:99px;background:var(--ink);color:#fff;font-size:calc(10px*var(--k));font-weight:900}
.prank-text{font-size:calc(30px*var(--k));font-weight:900;line-height:1.15;text-transform:uppercase;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}

.fly{position:absolute;z-index:40;width:calc(32px*var(--k));height:calc(32px*var(--k));pointer-events:none;transition:transform .65s cubic-bezier(.5,0,.6,1),opacity .2s .5s}
.fly img{width:100%;height:100%;object-fit:contain}
.spark{position:absolute;z-index:15;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;pointer-events:none;transition:transform .6s cubic-bezier(.2,.7,.3,1),opacity .6s}
.confetti{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:25}

/* wide screens: use the whole width */
.wide .main{max-width:calc(1180px*var(--k))}
.wide .panel{display:grid;grid-template-columns:1fr minmax(0,calc(380px*var(--k)));column-gap:calc(20px*var(--k));align-items:center}
.wide .panel .btn{grid-column:2;grid-row:1/3}
.wide .bar{margin-bottom:0}
@keyframes wig{25%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:scale(1.15)}}
@keyframes nextp{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes fade{from{opacity:0}}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes bumpI{50%{transform:scale(1.2)}}
@keyframes cardin{from{transform:scale(.7);opacity:0}}
@keyframes popin{from{transform:scale(0)}}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fillin{from{opacity:0;transform:translateY(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loadbar{to{width:100%}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (max-height:720px){.event p{display:none}.btn{height:calc(46px*var(--k))}}
</style>
</head>
<body>
<div class="rotate"><i>📱</i><span id="rotateText"></span></div>
<div class="app">
<div class="game" id="game">

  <div class="main">

    </div>

    <nav class="tabs" aria-hidden="true">

      <div class="tab"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17.5 14.5c2.6 0 4.5 1.7 4.5 4.5"/></svg><span>Friends</span></div>
      <div class="tab plus"><span class="mk"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i></span></div>
      <div class="tab"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg><span>Inbox</span><em class="dot">3</em></div>
      <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Profile</span></div>
    </nav>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- reveal -->
  <section class="modal" id="reveal" hidden>

      <span class="tag" id="rvDay"></span>

  <!-- transfer to account -->

    <div class="sbar"><button class="icon" id="sendBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><b id="sendTitle"></b><i class="sp"></i></div>
    <div class="bal"><span class="coin" data-coin></span><div><b id="sendCoins">0</b><small id="sendBalText"></small></div></div>
    <div class="sec"><span id="sendGiftsTitle"></span><em id="sgCount"></em></div>
    <div class="chips" id="chips"></div>
    <div class="sec"><span id="sendToTitle"></span></div>
    <label class="search" id="nickField"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>@</span><input id="nick" type="text" maxlength="24" placeholder="nickname" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button class="paste" id="paste" type="button">Paste</button></label>
    <div class="acct" id="acct" hidden><span class="av" id="acctAv"></span><div><b id="acctName"></b><small id="acctSub"></small></div><span class="ok"><svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7.5"/></svg></span></div>
    <p class="hint2" id="nickHint"></p>
    <button class="btn y" id="sendNick" type="button"></button>
  </section>

  <section class="screen sending" id="sending" hidden>
    <div class="who"><span class="av big" id="sAv"></span><b class="acc"></b></div>
    <h2 id="sendingTitle"></h2>

    <h2 id="doneTitle"></h2>
    <div class="amount"><span class="coin" data-coin></span><span id="doneAmount"></span></div>
    <div class="sent" id="sent"></div>
    <p id="doneText"></p>
    <div class="actions">
      <button class="btn y" id="again2" type="button">Play again</button>
      <button class="btn w" id="learn" type="button">Learn more</button>
    </div>
  </section>

  <section class="screen" id="prank" hidden>
    <div class="prank-text" id="prankText"></div>
    <p id="prankNote"></p>
    <div class="actions"><button class="btn y" id="again3" type="button">Play again</button></div>
  </section>
</div>
</div>

<script>
/* =====================================================================
   NEW YEAR ADVENT CALENDAR — one self-contained file, no libraries.
   Full screen on phones and tablets (everything scales up on big screens),
   a centred phone on computers. Change only the SETTINGS below.
   ===================================================================== */
/* ============================ SETTINGS ============================ */
var CONFIG = {
  days: 24,                        // boxes in the calendar (4 per row)
  startCoins: 500,
  sequential: false,               // false: any box can be opened. true: days open one after another (day 1, 2, 3 ...)
  // the prize of every day, from day 1 to day 24 — the further the day, the better.
  // a number = coins, a name = a TikTok gift (its coin price is added to the balance)
  prizes: [500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 7500, 9000,
           10000, 12500, 15000, 17500, 20000, 'Phoenix', 'Dragon', 'Lion', 'Thunder Eagle', 'Pegasus', 50000, 100000],
  giftValues: { 'Rose': 1, 'Lion': 29999, 'Phoenix': 25999, 'Dragon': 26999, 'Pegasus': 42999, 'Thunder Eagle': 39999 },  // coin price of each prize gift
  transferTime: 1200,              // how long the 'Transferring…' screen shows, ms
  text: {
    ny: 'Happy New Year <em>2027</em>', evSmall: 'New Year event', evTitle: 'TikTok Advent Calendar', evSub: 'Open any box — the further the day, the bigger the prize',
    opened: 'Opened', gifts: 'Gifts', day: 'Day', open: 'Open', lockedMsg: 'Open Day {n} first',
    coinTitle: 'Coins!', coinText: 'Coins added to your balance', giftTitle: 'TikTok gift!', giftText: 'Gift value added to your coin balance', lastTitle: 'Grand prize!', claim: 'Claim reward',
    transfer: 'Transfer to account',
    sendTitle: 'Transfer to account', sendBal: 'Coins balance', sendGifts: 'TikTok gifts', noGifts: 'No gifts yet — keep opening boxes 🎁', sendTo: 'Send to', send: 'Transfer',
    sender: 'New Year Event', sending: 'Transferring…', doneTitle: 'Happy New Year! 🎆',
    rotate: 'Turn your phone upright to play'
  },
  prankText: 'Это пранк, и всё это нереально',
  prankNote: 'The coins and gifts are not real. Thanks for playing!'
};
/* ================================================================== */

window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (cb) { return setTimeout(function () { cb(Date.now()); }, 16); };
if (window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;
if (window.Element && !Element.prototype.remove) Element.prototype.remove = function () { if (this.parentNode) this.parentNode.removeChild(this); };

document.addEventListener('DOMContentLoaded', function () {
  var MEDIA = window.MEDIA || {}, T = CONFIG.text, K = 1;
  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function ri(n) { return Math.floor(Math.random() * n); }
  function num(n) { return Math.max(0, Math.round(n)).toLocaleString('en-US'); }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function setCls(el, cls, on) { if (on) el.classList.add(cls); else el.classList.remove(cls); }
  var game = $('game');

  var COIN = '<img src="' + MEDIA.coin + '" alt="" draggable="false">';
  function giftPic(name) { var p = (MEDIA.gifts || {})[name]; return p ? '<img src="' + p + '" alt="" draggable="false">' : '<span style="font-size:2em">🎁</span>'; }
  function gv(g) { return (CONFIG.giftValues || {})[g] || 0; }
  document.querySelectorAll('[data-coin]').forEach(function (el) { el.innerHTML = COIN; });
  // profile picture (MEDIA.avatar at the end of the file); without it the first letter of the nickname is shown
  var AVATAR = MEDIA.avatar ? '<img src="' + MEDIA.avatar + '" alt="" draggable="false">' : '';
  function setAv(el, nick) { if (AVATAR) el.innerHTML = AVATAR; else el.textContent = nick.charAt(0).toUpperCase(); }
  document.querySelectorAll('[data-avatar]').forEach(function (el) { el.innerHTML = AVATAR; });
  var setText = { evTitle: 'evTitle', evSub: 'evSub', sendOpenText: 'transfer', claim: 'claim', sendTitle: 'sendTitle', sendBalText: 'sendBal',
    sendGiftsTitle: 'sendGifts', sendToTitle: 'sendTo', sendNick: 'send', sendingTitle: 'sending', doneTitle: 'doneTitle', rotateText: 'rotate' };
  Object.keys(setText).forEach(function (id) { $(id).textContent = T[setText[id]]; });
  $('nyText').innerHTML = T.ny;
  $('prankText').textContent = CONFIG.prankText; $('prankNote').textContent = CONFIG.prankNote;
  var prizeGifts = CONFIG.prizes.filter(function (p) { return typeof p === 'string'; });

  /* ---------- state ---------- */
  var coins, opened, gotGifts, busy, current = null;
  function reset() {
    stopSend();
    coins = CONFIG.startCoins; opened = 0; gotGifts = []; busy = false; current = null;
    buildGrid(); updateHud(); showCoins();
  }
  function showCoins() { $('coins').textContent = num(coins); $('sendCoins').textContent = num(coins); }
  function updateHud() {
    $('openedText').textContent = T.opened + ' ' + opened + ' / ' + CONFIG.days;
    $('giftsText').textContent = T.gifts + ' ' + gotGifts.length + ' / ' + prizeGifts.length;
    $('bar').style.width = (opened / CONFIG.days * 100) + '%';
    $('giftBadge').hidden = !gotGifts.length; $('giftBadge').textContent = gotGifts.length;
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false; replay(t, 'show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 1800);
  }

  /* ---------- grid ---------- */
  var cells = [], LOCK = '<span class="lk"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>';
  function prizeFor(day) {
    var p = CONFIG.prizes[day - 1];
    if (typeof p === 'string') return { gift: p };
    return { coins: typeof p === 'number' ? p : 100 * day };
  }
  function buildGrid() {
    var g = $('grid'), html = '';
    for (var i = 1; i <= CONFIG.days; i++) {
      var pz = prizeFor(i);
      html += '<button class="box' + (i === CONFIG.days ? ' b24' : '') + (pz.gift ? ' gift' : '') + '" type="button" data-d="' + i + '">' + LOCK +
        '<span class="tease">' + (pz.gift ? giftPic(pz.gift) : '') + '</span><span class="q" data-n="' + i + '"></span><span class="won"></span><span class="day">' + T.day + '</span></button>';
    }
    g.innerHTML = html;
    cells = [].slice.call(g.querySelectorAll('.box'));
    cells.forEach(function (b) { b.addEventListener('click', function () { openBox(b); }); });
    markNext(); layout();
  }
  // the day to open now pulses, the days after it are locked
  function markNext() {
    cells.forEach(function (b) {
      var d = +b.getAttribute('data-d'), isOpen = b.classList.contains('open');
      setCls(b, 'next', !isOpen && CONFIG.sequential && d === opened + 1);
      setCls(b, 'lock', !isOpen && CONFIG.sequential && d > opened + 1);
      if (!isOpen) b.querySelector('.day').textContent = b.classList.contains('next') ? T.open : T.day;
    });
  }
  function layout() {
    var w = game.clientWidth, h = game.clientHeight;
    // wide screens (tablet / phone landscape): 6 columns across the whole width; tall screens: 4 columns
    var wide = w > h * 1.05, cols = wide ? 6 : 4;
    setCls(game, 'wide', wide);
    K = wide ? Math.max(.88, Math.min(1.6, h / 760, w / 900)) : Math.max(.88, Math.min(1.8, w / 390, h / 820));
    var g = $('grid'); g.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)'; g.style.gridTemplateRows = 'repeat(' + Math.ceil(CONFIG.days / cols) + ',1fr)';
    document.documentElement.style.setProperty('--k', K.toFixed(3));
    var tt = $('evTitle'); tt.style.fontSize = ''; var fs = parseFloat(getComputedStyle(tt).fontSize), avail = tt.parentNode.clientWidth - 32;
    if (tt.scrollWidth > avail) tt.style.fontSize = Math.floor(fs * avail / tt.scrollWidth) + 'px';
    if (cells[0]) { var r = cells[0].getBoundingClientRect(); game.style.setProperty('--cs', Math.min(r.width, r.height * 1.15) + 'px'); }
  }
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(game);

  setInterval(function () {
    if (busy || CONFIG.sequential || !$('send').hidden || !$('done').hidden || !$('prank').hidden || !$('sending').hidden) return;
    var closed = cells.filter(function (b) { return !b.classList.contains('open'); });
    if (closed.length) replay(closed[ri(closed.length)], 'wig');
  }, 1800);

  /* ---------- open a box ---------- */
  function openBox(b) {
    if (busy || b.classList.contains('open')) return;
    var day = +b.getAttribute('data-d');
    if (CONFIG.sequential && day !== opened + 1) { toast(T.lockedMsg.replace('{n}', opened + 1)); vibrate(20); replay(b, 'nope'); return; }
    busy = true; vibrate(15);
    var prize = prizeFor(day);
    current = { box: b, day: day, prize: prize };
    b.classList.remove('wig'); b.classList.remove('next');
    (function () {
      burst(b);
      b.classList.remove('lock'); b.classList.add('open'); if (prize.gift) b.classList.add('isgift');
      b.querySelector('.day').textContent = T.day + ' ' + day;
      b.querySelector('.won').innerHTML = prize.gift ? '<span class="gpic">' + giftPic(prize.gift) + '</span>'
        : '<span class="coin">' + COIN + '</span><b>+' + short(prize.coins) + '</b>';
      opened++; updateHud();
      showReveal();
    })();
  }
  function short(n) { return n >= 1000 ? (n / 1000) + 'k' : String(n); }
  function showReveal() {
    var p = current.prize, last = current.day === CONFIG.days;
    $('rvDay').textContent = T.day.toUpperCase() + ' ' + current.day;
    $('rvPrize').className = 'prize' + (p.gift ? ' gift' : '');
    $('rvPic').innerHTML = p.gift ? giftPic(p.gift) : COIN;
    $('rvTitle').textContent = last ? T.lastTitle : p.gift ? T.giftTitle : T.coinTitle;
    $('rvBig').className = 'big' + (p.gift ? ' name' : '');
    $('rvBig').textContent = p.gift ? p.gift : '+' + num(p.coins);
    $('rvText').textContent = p.gift ? T.giftText : T.coinText;
    $('rvWorth').hidden = !p.gift; if (p.gift) $('rvWorthN').textContent = '+' + num(gv(p.gift));
    $('reveal').hidden = false;
    var big = p.gift || last || p.coins >= 10000;
    vibrate(big ? [40, 40, 80] : [20, 30, 20]);
    if (big) confetti($('reveal'));
  }
  $('claim').addEventListener('click', function () {
    var c = current; if (!c) return;
    $('reveal').hidden = true; current = null;
    if (c.prize.gift) {
      gotGifts.push(c.prize.gift);
      fly(c.box, $('sendBtn'), giftPic(c.prize.gift), 1, function () { updateHud(); replay($('sendBtn'), 'bump'); });
      addCoins(c.box, gv(c.prize.gift));
    } else {
      addCoins(c.box, c.prize.coins);
    }
    markNext();
    busy = false;
    if (opened === CONFIG.days) setTimeout(openSend, 900);
  });

  // the balance grows by exactly v: split into whole parts, the last part takes the rest
  function addCoins(from, v) {
    if (!v) return;
    var n = v >= 10000 ? 10 : v >= 1000 ? 6 : v > 3 ? 4 : 1, part = Math.floor(v / n), last = v - part * (n - 1);
    fly(from, $('coinPill'), COIN, n, function (i) { coins += i === n - 1 ? last : part; showCoins(); replay($('coinPill'), 'bump'); });
  }
  function fly(fromEl, toEl, pic, n, onEach) {
    var from = fromEl.getBoundingClientRect(), to = toEl.getBoundingClientRect(), box = game.getBoundingClientRect();
    for (var i = 0; i < n; i++) (function (i) {
      var c = document.createElement('div'); c.className = 'fly'; c.innerHTML = pic;
      var sx = from.left - box.left + from.width / 2 - 17 + rand(-18, 18), sy = from.top - box.top + from.height / 2 - 17 + rand(-18, 18);
      c.style.left = sx + 'px'; c.style.top = sy + 'px';
      if (n === 1 && pic !== COIN) { c.style.width = c.style.height = (44 * K) + 'px'; }
      game.appendChild(c);
      setTimeout(function () { c.style.transform = 'translate(' + (to.left - box.left + to.width / 2 - 17 - sx) + 'px,' + (to.top - box.top + to.height / 2 - 17 - sy) + 'px) scale(.75)'; c.style.opacity = '0'; }, 30 + i * 60);
      setTimeout(function () { c.remove(); onEach(i); }, 680 + i * 60);
    })(i);
  }
  function burst(b) {
    var r = b.getBoundingClientRect(), box = game.getBoundingClientRect(), cols = ['#25f4ee', '#fe2c55', '#161823', '#fe2c55'];
    for (var i = 0; i < 16; i++) {
      var s = document.createElement('i'); s.className = 'spark';
      s.style.left = (r.left - box.left + r.width / 2) + 'px'; s.style.top = (r.top - box.top + r.height / 2) + 'px'; s.style.background = cols[i % 4];
      game.appendChild(s);
      (function (s, a, d) { requestAnimationFrame(function () { requestAnimationFrame(function () { s.style.transform = 'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px)'; s.style.opacity = '0'; }); });
        setTimeout(function () { s.remove(); }, 800); })(s, i / 16 * 6.283, rand(40, 90));
    }
  }
  function confetti(box) {
    var colors = ['#25f4ee', '#fe2c55', '#161823', '#25f4ee', '#fe2c55'];
    for (var i = 0; i < 44; i++) {
      var c = document.createElement('i');
      c.className = 'confetti'; c.style.left = rand(0, 100) + '%'; c.style.background = colors[i % 5];
      c.style.animationDuration = rand(1.6, 3) + 's'; c.style.animationDelay = rand(0, .5) + 's';
      c.addEventListener('animationend', function () { this.remove(); });
      box.appendChild(c);
    }
  }

  function hideAll() { ['reveal', 'send', 'sending', 'done', 'prank'].forEach(function (id) { $(id).hidden = true; }); }

  /* ---------- transfer to account ---------- */
  var DESKTOP = !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches);
  function cleanNick(v) { return String(v).replace(/^\s*@+/, '').replace(/\s+/g, ''); }
  function validNick(n) { return /^[A-Za-z0-9._]{2,24}$/.test(n); }
  function updateAcct() {
    var n = cleanNick($('nick').value), ok = validNick(n), was = !$('acct').hidden;
    $('acct').hidden = !ok;
    if (ok) { $('acctName').textContent = '@' + n; setAv($('acctAv'), n); $('acctSub').textContent = 'Account found'; if (!was) replay($('acct'), 'fill'); }
  }
  function openSend() {
    showCoins();
    $('sgCount').textContent = gotGifts.length + ' / ' + prizeGifts.length;
    $('chips').innerHTML = gotGifts.length ? gotGifts.map(function (g) {
      return '<div class="chip"><span class="gpic">' + giftPic(g) + '</span><span>' + g + '<small><span class="coin">' + COIN + '</span>' + num(gv(g)) + '</small></span></div>';
    }).join('') : '<span class="nogift">' + T.noGifts + '</span>';
    $('nickHint').textContent = ''; updateAcct();
    hideAll(); $('send').hidden = false; $('send').scrollTop = 0;
    if (DESKTOP) setTimeout(function () { try { $('nick').focus(); } catch (e) {} }, 250);
  }
  $('sendBtn').addEventListener('click', function () { if (!busy) openSend(); });
  $('sendOpen').addEventListener('click', function () { if (!busy) openSend(); });
  $('sendBack').addEventListener('click', function () { try { $('nick').blur(); } catch (e) {} hideAll(); });

  var NICK_A = ['lucky', 'snowy', 'merry', 'jolly', 'frosty', 'neon', 'happy', 'cozy', 'gold', 'sweet', 'magic', 'chill', 'sparkly', 'super'];
  var NICK_B = ['elf', 'star', 'fox', 'panda', 'reindeer', 'vibes', 'queen', 'king', 'gamer', 'bunny', 'snowman', 'cookie', 'santa', 'kitty'];
  function randomNick() { var a = NICK_A[ri(NICK_A.length)], b = NICK_B[ri(NICK_B.length)], n = 1 + ri(999); return [a + '.' + b, a + '_' + b + n, b + '.' + a + n, a + b + n][ri(4)]; }
  $('paste').addEventListener('click', function (e) { e.preventDefault(); $('nick').value = randomNick(); $('nickHint').textContent = ''; replay($('nick'), 'fill'); updateAcct(); vibrate(10); });
  $('nick').addEventListener('input', function () { if (this.value.charAt(0) === '@') this.value = this.value.replace(/^@+/, ''); $('nickHint').textContent = ''; updateAcct(); });

  /* ---------- transferring ---------- */
  var sendTimers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); sendTimers.push(t); return t; }
  function stopSend() { sendTimers.forEach(function (t) { clearTimeout(t); }); sendTimers = []; }
  function sendNick() {
    var nick = cleanNick($('nick').value);
    if (!validNick(nick)) {
      $('nickHint').textContent = 'Use 2–24 letters, numbers, dots or underscores';
      replay($('nickField'), 'bad'); vibrate(30); return;
    }
    $('nick').value = nick; try { $('nick').blur(); } catch (err) {}
    stopSend();
    document.querySelectorAll('.acc').forEach(function (el) { el.textContent = '@' + nick; });
    setAv($('sAv'), nick);
    var seq = gotGifts.map(function (g) { return { name: g, qty: 1 }; }), total = CONFIG.transferTime || 1200;
    $('sendAmount').textContent = num(coins) + ' coins' + (seq.length ? ' + ' + seq.length + ' gift' + (seq.length > 1 ? 's' : '') : '');
    var bar = $('sending').querySelector('.load i'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = 'loadbar ' + (total / 1000) + 's linear forwards';
    hideAll(); $('sending').hidden = false;
    later(function () { finishSend(nick, seq); }, total);
  }
  function finishSend(nick, seq) {
    stopSend();
    $('doneAmount').textContent = num(coins);
    $('sent').innerHTML = seq.map(function (g) { return '<span class="sg"><span class="gpic">' + giftPic(g.name) + '</span>' + (g.qty > 1 ? '<b>x' + g.qty + '</b>' : '') + '</span>'; }).join('');
    $('sent').hidden = !seq.length;
    $('doneText').innerHTML = (seq.length ? 'coins and TikTok gifts' : 'coins') + ' were transferred to <b class="acc">@' + nick + '</b>';
    hideAll(); $('done').hidden = false; confetti($('done')); vibrate([30, 50, 30]);
  }
  $('sendNick').addEventListener('click', sendNick);
  $('nick').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); sendNick(); } });
  $('learn').addEventListener('click', function () { hideAll(); $('prank').hidden = false; });
  function playAgain() { hideAll(); reset(); }
  // tap on the coin balance = start over (all boxes closed, balance back to start)
  $('coinPill').style.cursor = 'pointer';
  $('coinPill').addEventListener('click', function () { if (busy) return; hideAll(); reset(); vibrate(15); });
  $('again2').addEventListener('click', playAgain);
  $('again3').addEventListener('click', playAgain);

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  reset();
});
</script>
